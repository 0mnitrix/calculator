<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг — Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ethno.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <img src="assets/logo_heritago.svg" alt="Heritago logo" />
          <strong>Heritago</strong>
        </div>
        <div class="nav-links">
          <a href="index.html">Главная</a>
          <a href="dashboard.html">Кабинет</a>
          <a href="leaderboard.html">Рейтинг</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-heading"><span></span><h2>Лидерборд</h2></div>
    <div class="main-card pattern-overlay">
      <div class="badge">Алтын бордюр</div>
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Участник</th>
            <th>Очки</th>
            <th>Бейджи</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Nurkyz</td>
            <td>3 120</td>
            <td><span class="chip">Алтын тил</span></td>
          </tr>
          <tr>
            <td>2</td>
            <td>Aizada</td>
            <td>2 940</td>
            <td><span class="chip">Манас таануу</span></td>
          </tr>
          <tr>
            <td>3</td>
            <td>Bakyt</td>
            <td>2 730</td>
            <td><span class="chip">Комуз үнү</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
