<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Настройки — Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ethno.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <img src="assets/logo_heritago.svg" alt="Heritago logo" />
          <strong>Heritago</strong>
        </div>
        <div class="nav-links">
          <a href="index.html">Главная</a>
          <a href="dashboard.html">Кабинет</a>
          <a href="settings.html">Настройки</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-heading"><span></span><h2>Настройки</h2></div>
    <div class="grid cols-2">
      <div class="card border-band">
        <div class="badge">Уведомления</div>
        <form>
          <label><input type="checkbox" checked /> Новые уроки</label>
          <label><input type="checkbox" /> Оффлайн-ивенты</label>
          <label><input type="checkbox" checked /> Рейтинг жаңылыктар</label>
          <button class="btn primary" type="button">Сохранить</button>
        </form>
      </div>
      <div class="card">
        <div class="badge">Тема</div>
        <p class="lead">Этно-графическая тема активна. Добавим светлые/темные узоры позже.</p>
        <button class="btn secondary" type="button">Сбросить</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
