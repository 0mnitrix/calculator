<!DOCTYPE html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritago • Кирүү</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body data-page="login">
    <main class="auth-wrapper">
      <div class="auth-card border-band">
        <div class="brand">
          <img src="/assets/logo_heritago.svg" alt="Heritago" />
          <div>
            <strong>Heritago</strong>
            <p>Этно билимге кирүү</p>
          </div>
        </div>
        <form data-auth>
          <div>
            <label>Email</label>
            <input name="email" type="email" placeholder="email@example.com" required />
          </div>
          <div>
            <label>Пароль</label>
            <input name="password" type="password" placeholder="••••••" required />
          </div>
          <button class="btn primary" type="submit">Кирүү</button>
          <p class="form-hint" data-auth-status></p>
          <p>Катталган эмессизби? <a href="/register.html">Катталуу</a></p>
        </form>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
