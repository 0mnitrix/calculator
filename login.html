<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <img src="assets/logo_heritago.svg" alt="Heritago logo" />
          <strong>Heritago</strong>
        </div>
        <div class="nav-links">
          <a href="index.html">Главная</a>
          <a href="courses.html">Курсы</a>
          <a href="dashboard.html">Кабинет</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="auth-wrapper pattern-overlay">
    <div class="auth-card">
      <div class="badge">Добро пожаловать</div>
      <h2>Вход в Heritago</h2>
      <p class="lead">Погрузитесь в этно-уроки, тесты жана аудио.</p>
      <form data-auth>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div>
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" required />
        </div>
        <button class="btn primary" type="submit">Войти</button>
      </form>
      <p>Нет аккаунта? <a href="signup.html">Регистрация</a></p>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
