        <a class="menu-item"><img src="assets/icons/games.png"> Оюндар</a>

        <a class="menu-item"><img src="assets/icons/cinema.png"> Кино</a>
        <a class="menu-item"><img src="assets/icons/sanjira.png"> Санжыра</a>

    <main>
        <h2>Глобал чат</h2>

        <button class="button chat-toggle">Чатты ачуу</button>

    <div class="chat-panel">
        <header>Жандуу талкуу</header>
        <p>Саламатсызбы! Бул жерде дос таба аласыз.</p>
        <input class="search-input" placeholder="Жазуу...">
