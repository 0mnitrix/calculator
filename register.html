<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heritago — Катталуу</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ai.css">
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:#0b0806;">
  <main class="card" style="width:min(460px,90vw);">
    <div class="section-title"><h2>Катталуу</h2><span class="helper-text">Жаңы аккаунт түзүү</span></div>
    <form class="content-grid" style="gap:12px;">
      <label>Аты<br><input type="text" name="name" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);"></label>
      <label>Email<br><input type="email" name="email" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);"></label>
      <label>Сырсөз<br><input type="password" name="password" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);"></label>
      <button class="button" type="submit">Катталуу</button>
    </form>
    <p class="helper-text">Эми аккаунтуңуз барбы? <a href="login.html">Кирүү</a></p>
  </main>
</body>
</html>
