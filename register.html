<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Катталуу | Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body style="max-width: 640px; margin: 0 auto;">
  <header>
    <div class="brand"><strong>HERITAGO</strong><span>Катталуу</span></div>
  </header>
  <main style="padding:24px;">
    <section class="card" style="margin-top:16px;">
      <h2>Катталуу</h2>
      <form style="margin-top:12px; display:grid; gap:12px;">
        <div>
          <label>Аты</label>
          <input type="text" placeholder="Аты" />
        </div>
        <div>
          <label>Email</label>
          <input type="email" placeholder="email@example.com" />
        </div>
        <div>
          <label>Сырсөз</label>
          <input type="password" placeholder="••••••" />
        </div>
        <button class="btn" type="submit">Катталуу</button>
      </form>
      <p style="margin-top:12px;">Бара турган аккаунт барбы? <a href="login.html">Кирүү</a></p>
    </section>
  </main>
</body>
</html>
