<!DOCTYPE html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritago • Катталуу</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body data-page="register">
    <main class="auth-wrapper">
      <div class="auth-card border-band">
        <div class="brand">
          <img src="/assets/logo_heritago.svg" alt="Heritago" />
          <div>
            <strong>Heritago</strong>
            <p>Этно билимге кош келиңиз</p>
          </div>
        </div>
        <form>
          <div>
            <label>Аты-жөнү</label>
            <input type="text" placeholder="Аты" />
          </div>
          <div>
            <label>Email</label>
            <input type="email" placeholder="email@example.com" />
          </div>
          <div>
            <label>Пароль</label>
            <input type="password" placeholder="••••••" />
          </div>
          <button class="btn primary" type="button">Катталуу</button>
          <p>Аккаунтуңуз барбы? <a href="/login.html">Кирүү</a></p>
        </form>
      </div>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
