<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль — Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ethno.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <img src="assets/logo_heritago.svg" alt="Heritago logo" />
          <strong>Heritago</strong>
        </div>
        <div class="nav-links">
          <a href="index.html">Главная</a>
          <a href="dashboard.html">Кабинет</a>
          <a href="profile.html">Профиль</a>
        </div>
        <div class="nav-actions">
          <a class="btn secondary" href="settings.html">Настройки</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-heading"><span></span><h2>Профиль</h2></div>
    <div class="two-column">
      <div class="main-card pattern-overlay">
        <div class="lesson-hero">
          <div class="avatar">AI</div>
          <div>
            <h3>Aizada Ismailova</h3>
            <p class="lead">Этно-энтузиаст, сүйүүчү кыргыз оюмдары жана комуз күүлөрү.</p>
          </div>
        </div>
        <div class="ethno-divider"></div>
        <div class="lesson-meta">
          <span class="chip">Алтын тил</span>
          <span class="chip">Манас таануу</span>
          <span class="chip">Комуз үнү</span>
        </div>
      </div>
      <aside class="ethno-panel">
        <div class="content">
          <h3>Настройки профиля</h3>
          <form>
            <label for="lang">Язык интерфейса</label>
            <select id="lang">
              <option>Кыргызча</option>
              <option>Русский</option>
              <option>English</option>
            </select>
            <button class="btn primary" type="button">Сохранить</button>
          </form>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
