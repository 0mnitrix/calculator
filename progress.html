<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Прогресс — Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ethno.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <img src="assets/logo_heritago.svg" alt="Heritago logo" />
          <strong>Heritago</strong>
        </div>
        <div class="nav-links">
          <a href="index.html">Главная</a>
          <a href="dashboard.html">Кабинет</a>
          <a href="progress.html">Прогресс</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-heading"><span></span><h2>Ваш путь</h2></div>
    <div class="grid cols-2">
      <div class="card border-band">
        <div class="badge">Статистика</div>
        <p class="lead">Этно-графические полосы подсвечивают ваш прогресс.</p>
        <div class="progress" aria-hidden="true"><div class="bar" style="width:72%"></div></div>
        <p>Всего времени: 12 ч 30 м</p>
      </div>
      <div class="card">
        <div class="badge">Бейджи</div>
        <div class="lesson-meta">
          <span class="chip">Алтын тил</span>
          <span class="chip">Комуз үнү</span>
          <span class="chip">Улуу Манас</span>
        </div>
      </div>
    </div>
    <table id="progress-table" class="table" style="margin-top: 24px;">
      <thead>
        <tr>
          <th>Курс</th>
          <th>Прогресс</th>
          <th>Уроки</th>
          <th>Язык</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/progress.js"></script>
</body>
</html>
