<!DOCTYPE html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritago • Рейтинг</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body data-page="rating">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/">
          <img src="/assets/logo_heritago.svg" alt="Heritago" />
          <div>
            <strong>Heritago</strong>
            <div class="label">Этно билим</div>
          </div>
        </a>
        <nav>
          <div>
            <div class="section-title">Контент</div>
            <ul class="nav-list">
              <li><a class="nav-item" data-nav="games" href="/categories/games.html"><span class="icon">🕹</span><span class="label">Оюндар</span></a></li>
              <li><a class="nav-item" data-nav="quiz" href="/categories/quiz.html"><span class="icon">❓</span><span class="label">Квиздер</span></a></li>
              <li><a class="nav-item" data-nav="cinema" href="/categories/cinema.html"><span class="icon">🎬</span><span class="label">Кино</span></a></li>
              <li><a class="nav-item" data-nav="sanjira" href="/categories/sanjira.html"><span class="icon">🐺</span><span class="label">Санжыра</span></a></li>
              <li><a class="nav-item" data-nav="explore" href="/categories/explore.html"><span class="icon">🌍</span><span class="label">Жер-Таануу</span></a></li>
              <li><a class="nav-item" data-nav="encyclopedia" href="/categories/encyclopedia.html"><span class="icon">📚</span><span class="label">Энциклопедия</span></a></li>
              <li><a class="nav-item" data-nav="books" href="/categories/books.html"><span class="icon">📖</span><span class="label">Китептер</span></a></li>
              <li><a class="nav-item" data-nav="news" href="/categories/news.html"><span class="icon">📰</span><span class="label">Жаңылыктар</span></a></li>
              <li><a class="nav-item" data-nav="favorites" href="/categories/favorites.html"><span class="icon">❤️</span><span class="label">Избранное</span></a></li>
            </ul>
          </div>
          <div>
            <div class="section-title">Социал</div>
            <ul class="nav-list">
              <li><a class="nav-item" data-nav="chat" href="/chat.html"><span class="icon">💬</span><span class="label">Глобал чат</span></a></li>
              <li><a class="nav-item" data-nav="rating" href="/rating.html"><span class="icon">⭐</span><span class="label">Рейтинг</span></a></li>
              <li><a class="nav-item" data-nav="profile" href="/profile.html"><span class="icon">👤</span><span class="label">Мен профиль</span></a></li>
            </ul>
          </div>
          <div>
            <div class="section-title">Система</div>
            <ul class="nav-list">
              <li><a class="nav-item" data-nav="settings" href="/settings.html"><span class="icon">⚙️</span><span class="label">Орнотуулар</span></a></li>
              <li><a class="nav-item" data-nav="language" href="/settings.html"><span class="icon">🌐</span><span class="label">Тил</span></a></li>
            </ul>
          </div>
        </nav>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar-inner">
            <button class="btn secondary" data-sidebar-toggle>☰</button>
            <div class="search">
              <span>🔍</span>
              <input data-search type="search" placeholder="Top издөө" />
            </div>
            <div class="actions">
              <a class="btn secondary" href="/profile.html">Профиль</a>
            </div>
          </div>
        </header>

        <main class="content-area">
          <div class="page-header">
            <h1>Рейтинг</h1>
            <div class="badge">XP</div>
          </div>

          <section class="section-block">
            <div class="section-heading">
              <div class="title-row"><div class="accent-line"></div><h3>Лидерборд</h3></div>
              <div class="tabs">
                <button data-tab="weekly" class="active">Жума</button>
                <button data-tab="monthly">Ай</button>
                <button data-tab="all">Бардык убакыт</button>
              </div>
            </div>
            <div class="leaderboard" data-leaderboard></div>
          </section>
        </main>
      </div>
    </div>

    <div class="ai-floating">
      <div class="ai-menu">
        <button data-ai-write>✍️ Жазуу</button>
        <button onclick="alert('Сүйлөө демо: микрофон иштетилген эмес')">🎤 Сүйлөө</button>
      </div>
      <button class="ai-trigger">AI</button>
    </div>

    <aside class="chat-panel" data-chat-panel>
      <div class="section-heading">
        <div class="title-row"><div class="accent-line"></div><h3>Heritago AI</h3></div>
        <button class="btn secondary" data-close-chat>Жабуу</button>
      </div>
      <div class="messages" data-chat-messages></div>
      <form>
        <input type="text" placeholder="Суроону жаз" />
        <button type="button" class="btn primary">Жөнөтүү</button>
      </form>
    </aside>

    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/rating.js"></script>
  </body>
</html>
