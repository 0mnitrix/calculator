<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кабинет — Heritago</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/ethno.css" />
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <img src="assets/logo_heritago.svg" alt="Heritago logo" />
          <strong>Heritago</strong>
        </div>
        <div class="nav-links">
          <a href="index.html">Главная</a>
          <a href="courses.html">Курсы</a>
          <a href="dashboard.html">Кабинет</a>
          <a href="progress.html">Прогресс</a>
        </div>
        <div class="nav-actions">
          <a class="btn secondary" href="settings.html">Настройки</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-heading"><span></span><h2>Саламатсызбы, Aizada!</h2></div>
    <div class="grid cols-3">
      <div class="card">
        <div class="badge">Прогресс</div>
        <h3>68%</h3>
        <p class="lead">Кыргыз тили (A1)</p>
        <div class="progress" aria-hidden="true"><div class="bar" style="width:68%"></div></div>
      </div>
      <div class="card">
        <div class="badge">Бейджи</div>
        <div class="lesson-meta">
          <span class="chip">Узорный старт</span>
          <span class="chip">Манас таануу</span>
        </div>
      </div>
      <div class="card">
        <div class="badge">Очки</div>
        <h3>1 240</h3>
        <p>Рейтинг в топ-15</p>
      </div>
    </div>

    <div class="two-column" style="margin-top: 32px;">
      <div class="main-card pattern-overlay">
        <div class="badge">Активные курсы</div>
        <div id="course-list" class="grid cols-2"></div>
      </div>
      <aside class="ethno-panel">
        <div class="content">
          <h3>Тапшырмалар</h3>
          <ul class="timeline">
            <li>Завершить урок: Саламдашуу</li>
            <li>Пройти тест: Лексика</li>
            <li>Послушать аудио: Комуз күүсү</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/courses.js"></script>
</body>
</html>
